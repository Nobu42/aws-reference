# Day 17 hands-on configuration.
# Keep this file as KEY=VALUE lines so sed and awk can inspect it easily.

RUN_MODE=mock
MOCK_SCENARIO=ok

AWS_CMD=aws
AWS_PROFILE=learning
AWS_REGION=ap-northeast-1

EXPECTED_ACCOUNT_ID=445405559057
TARGET_BUCKET=nobu-terraform-iac-lab-upload

CHECK_PUBLIC_ACCESS_BLOCK=true
CHECK_POLICY_STATUS=true
CHECK_BUCKET_POLICY=true

EVIDENCE_ROOT=evidence/day17_operations_shell
LOG_LEVEL=INFO

# 0: success
# 1: general error
# 2: usage error
# 10: validation error
# 20: AWS CLI error
# 30: account mismatch
EXIT_SUCCESS=0
EXIT_GENERAL_ERROR=1
EXIT_USAGE_ERROR=2
EXIT_VALIDATION_ERROR=10
EXIT_AWS_ERROR=20
EXIT_ACCOUNT_MISMATCH=30
